name: Build Karaj PMTiles dataset
on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "SOUTH,WEST,NORTH,EAST (approximate study extent)"
        required: false
        default: "35.70,50.88,35.98,51.12"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run data regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Extract OpenStreetMap data
        run: python scripts/karaj_data_pipeline.py --bbox "${{ inputs.bbox }}"
      - name: Validate source GeoJSON
        run: python scripts/validate_geojson.py public/data/karaj-osm.geojson
      - name: Prepare height-aware 3D buildings GeoJSON
        run: python scripts/build_3d_buildings.py public/data/karaj-osm.geojson public/data/karaj-3d.geojson
      - name: Split semantic layers
        run: python scripts/split_osm_layers.py public/data/karaj-osm.geojson --out-dir public/data/vector
      - name: Install Tippecanoe build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev libprotobuf-dev protobuf-compiler
      - name: Build Tippecanoe from source
        run: |
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j2
          sudo make -C /tmp/tippecanoe install
          tippecanoe --version
      - name: Generate and verify multi-layer PMTiles archive
        run: bash scripts/build_pmtiles.sh public/data/karaj.pmtiles public/data/vector
      - name: Verify PMTiles header and generate checksum report
        run: python scripts/verify_pmtiles.py public/data/karaj.pmtiles --report public/data/karaj-pmtiles-verify.json
      - name: Upload complete dataset bundle
        uses: actions/upload-artifact@v4
        with:
          name: karaj-pmtiles-${{ github.run_number }}
          path: |
            public/data/karaj.pmtiles
            public/data/karaj-osm.geojson
            public/data/karaj-3d.geojson
            public/data/karaj-data-report.json
            public/data/karaj-pmtiles-verify.json
            public/data/vector/*.geojson
            public/data/vector/layers-report.json
          retention-days: 30
