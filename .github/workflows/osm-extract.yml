name: Prepare Karaj OSM study extract
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download OSM features from Overpass (approximate bbox)
        run: python scripts/fetch_osm_karaj.py karaj-osm.geojson
      - name: Upload GeoJSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: karaj-osm-geojson-approximate-bbox
          path: karaj-osm.geojson
          retention-days: 7
